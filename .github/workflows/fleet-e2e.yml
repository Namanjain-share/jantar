name: fleet-e2e

# v0.6 Fleet: the Docker Linux end-to-end suite (test/docker/README.md). A hub
# behind a door that plays Cloudflare Access, a node with tmux, a node without,
# and a phone, each a container on an internal network, with the repo's fake
# interactive Claude (never the real one). E1-E15.

# About ten minutes of Docker, so only for changes that can change its result.
on:
  push:
    branches: [main, 'v0.*']
    paths:
      - 'packages/**'
      - 'test/docker/**'
      - 'test/fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/fleet-e2e.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'test/docker/**'
      - 'test/fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/fleet-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: fleet end to end (Docker, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # vitest on this side; the image installs and builds its own copy inside.
      - run: pnpm install --frozen-lockfile
      - run: node test/docker/run.mjs

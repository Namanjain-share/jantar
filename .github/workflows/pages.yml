name: pages

# Builds the website (site/) with scripts/build-site.mjs and deploys it to
# GitHub Pages. Before the first run, set Settings > Pages > Source to
# "GitHub Actions"; without that the deploy job fails.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/build-site.test.mjs'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'package.json'
      # the site's fonts come from packages/web's @fontsource packages
      - 'pnpm-lock.yaml'
      - 'packages/web/package.json'
      - 'packages/web/src/styles/**'
      - 'packages/web/public/icons/**'
      - 'packages/extension/manifest.json'
      - 'packages/cli/src/lib/doctor.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Chromium turns the screenshots into WebP and runs the test's browser
      # checks against a local server; neither reaches another host.
      - run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - run: node scripts/build-site.mjs --out site/dist
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Checks the folder that is deployed, not a fresh copy.
      - run: node --test scripts/build-site.test.mjs
        env:
          SITE_DIST: site/dist
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

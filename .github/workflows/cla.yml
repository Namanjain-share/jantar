# The Contributor License Agreement (CLA.md), signed once per contributor by
# a comment on their first pull request (CLA Assistant Lite). Signatures are
# kept on the cla-signatures branch, never on main, and that branch is left
# out of `check-secrets.mjs --history`. The signature commit's message names
# no owner or repository, and the owner (the licensor) signs nothing. The
# action checks out no pull request code, which is what makes
# pull_request_target safe here.
#
# The action is pinned to the full commit SHA of its v2.6.1 tag (a tag can
# be moved); update both together.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: contributor license agreement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          signed-commit-message: '$contributorName has signed the CLA in pull request #$pullRequestNo'
          allowlist: ${{ github.repository_owner }},dependabot[bot],github-actions[bot]
